apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-backup-config
  namespace: default  # Change to your namespace
data:
  backup.yaml: |
    # Log configuration
    log:
      level: info
      console: true
      file:
        rootPath: logs/backup.log

    # HTTP configuration
    http:
      simpleResponse: true

    # Milvus connection configuration
    milvus:
      address: localhost  # Change to your Milvus service address (e.g., milvus-proxy.namespace.svc.cluster.local)
      port: 19530
      user: root
      password: ""  # Will be overridden by MILVUS_PASSWORD environment variable
      tlsMode: 0  # 0: none, 1: one-way TLS, 2: two-way/mtls
      caCertPath: /opt/backup/certs/ca.crt  # Path to CA certificate (if tlsMode > 0)
      serverName: localhost  # Server name for TLS verification
      mtlsCertPath: ""  # Path to client certificate (if tlsMode = 2)
      mtlsKeyPath: ""  # Path to client key (if tlsMode = 2)

    # Minio/S3 storage configuration for Milvus data
    minio:
      storageType: minio  # Options: local, minio, s3, aws, gcp, ali, azure, tc, gcpnative
      address: localhost  # Change to your MinIO/S3 service address
      port: 9000
      accessKeyID: ""  # Will be overridden by secret
      secretAccessKey: ""  # Will be overridden by secret
      gcpCredentialJSON: ""
      useSSL: false
      bucketName: milvus-bucket  # Change based on your deployment (a-bucket for docker-compose, milvus-bucket for helm)
      rootPath: file  # Change based on your deployment (files for docker-compose, file for helm)

      # Backup storage settings (S3)
      backupStorageType: s3  # Options: local, minio, s3, aws, gcp, ali, azure, tc, gcpnative
      backupAddress: s3.amazonaws.com  # Change to your backup S3 endpoint
      backupPort: 443
      backupAccessKeyID: ""  # Will be overridden by BACKUP_MINIO_ACCESS_KEY_ID environment variable
      backupSecretAccessKey: ""  # Will be overridden by BACKUP_MINIO_SECRET_ACCESS_KEY environment variable
      backupGcpCredentialJSON: ""
      backupUseSSL: true
      backupBucketName: milvus-backup  # Change to your backup bucket name
      backupRootPath: backups  # Root path for backups in S3
      crossStorage: true  # Set to true to use different storage for backups

    # Backup operation settings
    backup:
      maxSegmentGroupSize: 2G
      parallelism:
        backupCollection: 4
        copydata: 128
        restoreCollection: 2
      keepTempFiles: false
      gcPause:
        enable: true
        seconds: 7200
        address: http://localhost:9091  # Change to your Milvus metrics address (e.g., http://milvus-proxy.namespace.svc.cluster.local:9091)

