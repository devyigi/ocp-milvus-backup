apiVersion: batch/v1
kind: CronJob
metadata:
  name: milvus-backup-cronjob
  namespace: default  # Change to your namespace
spec:
  # Schedule: Run daily at 2 AM UTC
  # Format: "minute hour day month weekday"
  # Examples:
  #   "0 2 * * *"     - Daily at 2 AM
  #   "0 */6 * * *"   - Every 6 hours
  #   "0 0 * * 0"     - Weekly on Sunday at midnight
  #   "0 3 1 * *"     - Monthly on the 1st at 3 AM
  schedule: "0 2 * * *"
  
  # Keep last 3 successful jobs for debugging
  successfulJobsHistoryLimit: 3
  
  # Keep last 3 failed jobs for debugging
  failedJobsHistoryLimit: 3
  
  # Concurrency policy: Forbid prevents overlapping jobs
  concurrencyPolicy: Forbid
  
  # Job template
  jobTemplate:
    spec:
      # Keep completed jobs for 24 hours (86400 seconds)
      ttlSecondsAfterFinished: 86400
      
      # Retry up to 3 times on failure
      backoffLimit: 3
      
      template:
        metadata:
          labels:
            app: milvus-backup
            job: backup-scheduled
        spec:
          restartPolicy: OnFailure
          
          # Security context for OpenShift
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          
          containers:
          - name: milvus-backup
            image: milvus-backup:0.5.10  # Change to your image registry/name
            imagePullPolicy: IfNotPresent
            
            # Security context for container
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            
            # Resource limits
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "2000m"
            
            # Environment variables from Secret
            env:
            - name: MILVUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: milvus-backup-secret
                  key: milvus-password
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: milvus-backup-secret
                  key: minio-access-key
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-backup-secret
                  key: minio-secret-key
            - name: BACKUP_MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: milvus-backup-secret
                  key: backup-access-key
            - name: BACKUP_MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-backup-secret
                  key: backup-secret-key
            
            # Volume mounts
            volumeMounts:
            - name: config
              mountPath: /opt/backup/configs
              readOnly: true
            - name: certs
              mountPath: /opt/backup/certs
              readOnly: true
            - name: logs
              mountPath: /opt/backup/logs
          
          # Volumes
          volumes:
          - name: config
            configMap:
              name: milvus-backup-config
          - name: certs
            secret:
              secretName: milvus-backup-secret
              items:
              - key: ca.crt
                path: ca.crt
              optional: true  # Make it optional if TLS is not always used
          - name: logs
            emptyDir: {}

