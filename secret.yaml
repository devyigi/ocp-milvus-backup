apiVersion: v1
kind: Secret
metadata:
  name: milvus-backup-secret
  namespace: default  # Change to your namespace
type: Opaque
stringData:
  # Milvus credentials
  milvus-password: "Milvus"  # Change to your Milvus password
  
  # MinIO/S3 credentials for Milvus storage
  minio-access-key: "minioadmin"  # Change to your MinIO/S3 access key
  minio-secret-key: "minioadmin"  # Change to your MinIO/S3 secret key
  
  # Backup storage credentials (if using separate backup storage)
  backup-access-key: "minioadmin"  # Change to your backup storage access key
  backup-secret-key: "minioadmin"  # Change to your backup storage secret key

# Made with Bob
